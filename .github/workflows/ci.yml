name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  development-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check, test and encode the component
        shell: bash
        run: |
          cargo fmt --manifest-path backend/Cargo.toml -- --check
          cargo fmt --manifest-path tools/component/Cargo.toml -- --check
          cargo clippy --locked --manifest-path backend/Cargo.toml --target-dir target/backend --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tools/component/Cargo.toml --target-dir target/tools --all-targets -- -D warnings
          cargo test --locked --manifest-path backend/Cargo.toml --target-dir target/backend
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path backend/Cargo.toml --target-dir target/backend
          cargo run --locked --manifest-path tools/component/Cargo.toml --target-dir target/tools -- target/backend/wasm32-unknown-unknown/release/alcomd_extension_discord_backend.wasm target/extension.wasm
      - name: Build a development package
        shell: bash
        run: |
          openssl_bin=openssl
          if [[ "$RUNNER_OS" == macOS ]]; then
            openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          fi
          "$openssl_bin" genpkey -algorithm ED25519 -out target/ci-key.pem
          python tools/package.py --openssl "$openssl_bin" --component target/extension.wasm --key target/ci-key.pem --out target/ALCOMD-Discord-Presence.alcomdextension
          git diff --exit-code
